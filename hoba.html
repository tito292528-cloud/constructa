<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONSTRUCTA - Contracting & Partner ERP | نظام إدارة المقاولات والشركاء</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            amber: {
              400: '#F3E5AB',
              500: '#D4AF37', // Gold Primary
              600: '#AA771C',
            },
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & ReactDOM & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
    }
    @media print {
      body { background: white !important; color: black !important; }
      .no-print { display: none !important; }
      .printable-area { width: 100% !important; margin: 0 !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#0B0F17] text-slate-800 dark:text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-500">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Realistic Demo Dataset
    function getInitialDemoData() {
      return {
        projects: [
          { id: 'p1', code: 'PRJ-101', name: 'برج الصفوة السكني - التجمع الخامس', clientName: 'شركة ديار مصر للتطوير العقاري', contractValue: 14500000, expectedCost: 10800000, actualCost: 7420000, progress: 68, status: 'active', startDate: '2025-09-01', expectedEndDate: '2026-12-31' },
          { id: 'p2', code: 'PRJ-102', name: 'كمبوند فلل الياسمين - الشيخ زايد', clientName: 'شركة إعمار المستقبل للاستثمار', contractValue: 22000000, expectedCost: 16500000, actualCost: 7850000, progress: 45, status: 'active', startDate: '2025-11-15', expectedEndDate: '2027-04-30' },
          { id: 'p3', code: 'PRJ-103', name: 'مول الواحة التجاري - العاصمة الإدارية', clientName: 'شركة كابيتال بلازا للمراكز التجارية', contractValue: 35000000, expectedCost: 26000000, actualCost: 25100000, progress: 96, status: 'active', startDate: '2025-03-01', expectedEndDate: '2026-11-30' },
        ],
        partners: [
          { id: 'pt1', name: 'م. أحمد الشامي', ownershipPercentage: 40, profitSharePercentage: 40, capitalContribution: 4000000, currentAccountBalance: 520000, totalWithdrawals: 450000, totalProfitReceived: 620000, phone: '+20 100 123 4567' },
          { id: 'pt2', name: 'م. محمد عبد الرحمن', ownershipPercentage: 35, profitSharePercentage: 35, capitalContribution: 3500000, currentAccountBalance: 390000, totalWithdrawals: 380000, totalProfitReceived: 540000, phone: '+20 101 987 6543' },
          { id: 'pt3', name: 'أ. علي حسن', ownershipPercentage: 25, profitSharePercentage: 25, capitalContribution: 2500000, currentAccountBalance: 240000, totalWithdrawals: 260000, totalProfitReceived: 380000, phone: '+20 102 555 7788' },
        ],
        invoices: [
          { id: 'inv1', invoiceNumber: 'INV-2026-004', clientName: 'شركة ديار مصر للتطوير العقاري', projectName: 'برج الصفوة السكني - التجمع الخامس', total: 2256300, paid: 2256300, remaining: 0, status: 'paid', date: '2026-08-25' },
          { id: 'inv2', invoiceNumber: 'INV-2026-005', clientName: 'شركة إعمار المستقبل للاستثمار', projectName: 'كمبوند فلل الياسمين - الشيخ زايد', total: 2616000, paid: 1200000, remaining: 1416000, status: 'partial', date: '2026-09-15' },
        ],
        expenses: [
          { id: 'exp1', description: 'إيجار المقر الإداري للشركة بالتسعين الشمالي', amount: 45000, category: 'rent', scope: 'company', date: '2026-09-02', paymentSource: 'bank' },
          { id: 'exp2', description: 'أجور عمالة نجارة وحدادة مسلحة صبة سقف الدور الخامس', amount: 85000, category: 'labor', scope: 'project', projectName: 'برج الصفوة السكني', date: '2026-09-08', paymentSource: 'cashbox' },
          { id: 'exp3', description: 'نقل توريدات سن ورمل وردم تربة للموقع', amount: 32000, category: 'transportation', scope: 'project', projectName: 'فلل الياسمين', date: '2026-09-15', paymentSource: 'cashbox' },
        ],
        cashboxBalance: 179500,
        bankAccounts: [
          { id: 'b1', bankName: 'البنك التجاري الدولي (CIB)', accountName: 'الحساب التشغيلي الرئيسي', accountNumber: '1000-4829-1920', currentBalance: 5850000 },
          { id: 'b2', bankName: 'بنك قطر الوطني الأهلي (QNB)', accountName: 'حساب المشروعات', accountNumber: '2030-9182-3841', currentBalance: 3420000 },
        ],
        suppliers: [
          { id: 's1', name: 'شركة حديد عز للتسليح', company: 'مجموعة حديد عز', phone: '+20 2 3338 9000', totalPurchases: 6800000, paid: 5500000, remaining: 1300000 },
          { id: 's2', name: 'شركة أسمنت السويس وحلوان', company: 'أسمنت السويس', phone: '+20 2 2522 1000', totalPurchases: 2950000, paid: 2400000, remaining: 550000 },
        ],
        subcontractors: [
          { id: 'sub1', name: 'شركة الفاروق للأعمال الصحية', projectName: 'برج الصفوة السكني', workScope: 'شبكات الصرف والتغذية', contractValue: 1200000, paid: 850000, remaining: 350000, workProgress: 75 },
          { id: 'sub2', name: 'مؤسسة الدلتا للأعمال الكهربائية', projectName: 'مول الواحة التجاري', workScope: 'إنذار حريق وإنارة ذكية', contractValue: 2800000, paid: 2600000, remaining: 200000, workProgress: 95 },
        ],
        laborers: [
          { id: 'l1', name: 'المعلم خميس رضوان', jobTitle: 'أسطى نجار مسلح', projectName: 'برج الصفوة السكني', dailyRate: 450, totalPaid: 48000 },
          { id: 'l2', name: 'المعلم صبحي الديب', jobTitle: 'أسطى حداد مسلح', projectName: 'برج الصفوة السكني', dailyRate: 450, totalPaid: 45000 },
        ],
        materials: [
          { id: 'm1', code: 'MAT-STL-16', name: 'حديد تسليح عز مشرشر 16 مم', unit: 'طن', quantity: 18, minStock: 10, averageCost: 41500 },
          { id: 'm2', code: 'MAT-CMT-SRC', name: 'أسمنت مقاوم للأملاح 50 كجم', unit: 'شيكارة', quantity: 450, minStock: 200, averageCost: 145 },
        ]
      };
    }

    function StandaloneConstructaApp() {
      const [lang, setLang] = useState('ar');
      const [theme, setTheme] = useState('dark');
      const [module, setModule] = useState('dashboard');
      const [printInvoiceData, setPrintInvoiceData] = useState(null);

      const [data, setData] = useState(() => {
        try {
          const saved = localStorage.getItem('constructa_standalone_data');
          return saved ? JSON.parse(saved) : getInitialDemoData();
        } catch {
          return getInitialDemoData();
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('constructa_standalone_data', JSON.stringify(data));
        } catch (e) {}
      }, [data]);

      useEffect(() => {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [lang, theme]);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      const formatCurrency = (val) => {
        const num = Number(val) || 0;
        return num.toLocaleString(lang === 'ar' ? 'ar-EG' : 'en-US') + (lang === 'ar' ? ' ج.م' : ' EGP');
      };

      // Aggregates
      const totalContractsVal = data.projects.reduce((a, b) => a + (b.contractValue || 0), 0);
      const totalSalesVal = data.invoices.reduce((a, b) => a + (b.total || 0), 0);
      const totalExpensesVal = data.expenses.reduce((a, b) => a + (b.amount || 0), 0);
      const totalBanksVal = data.bankAccounts.reduce((a, b) => a + (b.currentBalance || 0), 0);
      const totalProjectCosts = data.projects.reduce((a, b) => a + (b.actualCost || 0), 0);
      const netProfitVal = totalSalesVal - totalProjectCosts - data.expenses.filter(e => e.scope === 'company').reduce((a, b) => a + b.amount, 0);

      const handleDistributeProfits = () => {
        const amt = prompt(lang === 'ar' ? 'أدخل المبلغ الإجمالي المراد توزيعه على الشركاء:' : 'Enter total profit distribution amount:', '500000');
        if (!amt) return;
        const totalDist = Number(amt);
        setData(prev => ({
          ...prev,
          partners: prev.partners.map(p => {
            const share = (totalDist * p.profitSharePercentage) / 100;
            return {
              ...p,
              currentAccountBalance: p.currentAccountBalance + share,
              totalProfitReceived: p.totalProfitReceived + share
            };
          })
        }));
        alert(lang === 'ar' ? 'تم توزيع الأرباح بنجاح وإضافتها للحسابات الجارية للشركاء!' : 'Profits distributed successfully!');
      };

      return (
        <div className="min-h-screen flex bg-slate-50 dark:bg-[#0B0F17] text-slate-800 dark:text-slate-100">
          {/* Sidebar */}
          <aside className="w-64 border-e border-slate-200 dark:border-slate-800/80 bg-white dark:bg-[#0B0F17] flex flex-col shrink-0">
            <div className="h-16 flex items-center gap-3 px-6 border-b border-slate-200 dark:border-slate-800">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 flex items-center justify-center font-black text-black text-xl shadow-md shadow-amber-500/20">
                C
              </div>
              <div>
                <h1 className="font-black text-lg text-slate-900 dark:text-white uppercase">CONSTRUCTA</h1>
                <p className="text-[10px] text-amber-500 font-bold">نظام المقاولات والشركاء</p>
              </div>
            </div>

            <div className="flex-1 overflow-y-auto p-3 space-y-1">
              {[
                { id: 'dashboard', label: 'لوحة التحكم', icon: 'layout-dashboard' },
                { id: 'projects', label: 'المشاريع', icon: 'building-2', badge: data.projects.length },
                { id: 'partners', label: 'الشركاء والأرباح', icon: 'user-check' },
                { id: 'invoices', label: 'الفواتير والمستخلصات', icon: 'receipt' },
                { id: 'expenses', label: 'المصروفات', icon: 'credit-card' },
                { id: 'cashbox', label: 'الخزينة النقدية', icon: 'vault' },
                { id: 'banks', label: 'الحسابات البنكية', icon: 'landmark' },
                { id: 'suppliers', label: 'الموردون', icon: 'truck' },
                { id: 'subcontractors', label: 'المقاولون من الباطن', icon: 'hard-hat' },
                { id: 'labor', label: 'العمالة والموظفون', icon: 'wrench' },
                { id: 'inventory', label: 'المخزون والمواد', icon: 'boxes' },
                { id: 'reports', label: 'التقارير المالية (P&L)', icon: 'bar-chart-3' },
              ].map(item => (
                <button
                  key={item.id}
                  onClick={() => setModule(item.id)}
                  className={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-bold transition-all ${
                    module === item.id ? 'bg-amber-500 text-black shadow-sm' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                  }`}
                >
                  <div className="flex items-center gap-2.5">
                    <i data-lucide={item.icon} className="w-4 h-4"></i>
                    <span>{item.label}</span>
                  </div>
                  {item.badge && <span className="px-1.5 py-0.5 rounded text-[10px] bg-black/10 dark:bg-white/10 font-mono">{item.badge}</span>}
                </button>
              ))}
            </div>

            <div className="p-3 m-3 rounded-xl bg-slate-100 dark:bg-[#161C2A] text-xs text-slate-400">
              <span className="flex items-center gap-2 font-bold text-slate-800 dark:text-slate-200">
                <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                ملف HTML مستقل
              </span>
              <p className="text-[10px] mt-1">يعمل على أي جهاز بدون اتصال</p>
            </div>
          </aside>

          {/* Main Area */}
          <div className="flex-1 flex flex-col min-w-0">
            <header className="h-16 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-6 bg-white/80 dark:bg-[#0B0F17]/80">
              <span className="font-bold text-xs text-amber-500">CONSTRUCTA Enterprise v1.0 (Single HTML File)</span>
              <div className="flex items-center gap-2">
                <button onClick={() => setData(getInitialDemoData())} className="px-3 py-1.5 rounded-xl bg-amber-500/10 text-amber-500 text-xs font-bold hover:bg-amber-500/20">
                  تحميل بيانات تجريبية
                </button>
                <button
                  onClick={() => {
                    if (confirm('تفريغ كافة البيانات والبدء بقاعدة بيانات فارغة؟')) {
                      setData({ projects: [], partners: [], invoices: [], expenses: [], cashboxBalance: 0, bankAccounts: [], suppliers: [], subcontractors: [], laborers: [], materials: [] });
                    }
                  }}
                  className="px-2.5 py-1.5 rounded-xl hover:bg-rose-500/10 text-rose-500 text-xs font-semibold"
                >
                  تفريغ
                </button>
                <button onClick={() => setLang(lang === 'ar' ? 'en' : 'ar')} className="px-2.5 py-1.5 rounded-xl border border-slate-700 text-xs font-bold">
                  {lang === 'ar' ? 'English' : 'عربي'}
                </button>
                <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="p-2 rounded-xl border border-slate-700">
                  <i data-lucide={theme === 'dark' ? 'sun' : 'moon'} className="w-4 h-4"></i>
                </button>
              </div>
            </header>

            <main className="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
              {/* DASHBOARD */}
              {module === 'dashboard' && (
                <div className="space-y-6">
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="p-5 rounded-2xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800">
                      <p className="text-xs text-slate-400">إجمالي قيمة العقود</p>
                      <div className="text-2xl font-black mt-1 text-slate-900 dark:text-white">{formatCurrency(totalContractsVal)}</div>
                    </div>
                    <div className="p-5 rounded-2xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800">
                      <p className="text-xs text-slate-400">إجمالي المستخلصات</p>
                      <div className="text-2xl font-black mt-1 text-emerald-500">{formatCurrency(totalSalesVal)}</div>
                    </div>
                    <div className="p-5 rounded-2xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800">
                      <p className="text-xs text-slate-400">صافي الربح الفعلي</p>
                      <div className="text-2xl font-black mt-1 text-amber-500">{formatCurrency(netProfitVal)}</div>
                    </div>
                    <div className="p-5 rounded-2xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800">
                      <p className="text-xs text-slate-400">إجمالي المصروفات</p>
                      <div className="text-2xl font-black mt-1 text-rose-500">{formatCurrency(totalExpensesVal)}</div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div className="p-4 rounded-xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800">
                      <span className="text-xs text-slate-400">الخزينة النقدية:</span>
                      <div className="text-base font-bold text-amber-500 mt-1">{formatCurrency(data.cashboxBalance)}</div>
                    </div>
                    <div className="p-4 rounded-xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800">
                      <span className="text-xs text-slate-400">أرصدة البنوك:</span>
                      <div className="text-base font-bold text-blue-500 mt-1">{formatCurrency(totalBanksVal)}</div>
                    </div>
                    <div className="p-4 rounded-xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800">
                      <span className="text-xs text-slate-400">مستحقات على العملاء:</span>
                      <div className="text-base font-bold text-emerald-500 mt-1">{formatCurrency(data.invoices.reduce((a,b)=>a+b.remaining, 0))}</div>
                    </div>
                    <div className="p-4 rounded-xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800">
                      <span className="text-xs text-slate-400">مستحقات للموردين:</span>
                      <div className="text-base font-bold text-rose-500 mt-1">{formatCurrency(data.suppliers.reduce((a,b)=>a+b.remaining, 0))}</div>
                    </div>
                  </div>

                  <div className="p-6 rounded-2xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800 space-y-3">
                    <h3 className="font-bold text-sm">المشاريع قيد التنفيذ ونسب الإنجاز</h3>
                    {data.projects.map(p => (
                      <div key={p.id} className="p-3 rounded-xl border border-slate-100 dark:border-slate-800 space-y-2">
                        <div className="flex justify-between text-xs font-bold">
                          <span>{p.code} - {p.name}</span>
                          <span className="text-amber-500">{p.progress}%</span>
                        </div>
                        <div className="w-full h-2 rounded-full bg-slate-800 overflow-hidden">
                          <div className="h-full bg-amber-500" style={{ width: `${p.progress}%` }}></div>
                        </div>
                        <div className="flex justify-between text-xs text-slate-400 font-mono">
                          <span>قيمة العقد: {formatCurrency(p.contractValue)}</span>
                          <span>التكلفة المنفذة: {formatCurrency(p.actualCost)}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* PROJECTS */}
              {module === 'projects' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xl font-bold">المشاريع وتكاليف التنفيذ</h2>
                    <button
                      onClick={() => {
                        const name = prompt('اسم المشروع الجديد:');
                        if (!name) return;
                        const val = prompt('قيمة العقد (ج.م):', '5000000');
                        setData(prev => ({
                          ...prev,
                          projects: [
                            ...prev.projects,
                            {
                              id: 'p-' + Date.now(),
                              code: `PRJ-${prev.projects.length + 101}`,
                              name,
                              clientName: 'عميل معتمد',
                              contractValue: Number(val) || 0,
                              expectedCost: (Number(val) || 0) * 0.75,
                              actualCost: 0,
                              progress: 0,
                              status: 'active'
                            }
                          ]
                        }));
                      }}
                      className="px-4 py-2 rounded-xl bg-amber-500 text-black font-bold text-xs"
                    >
                      + إضافة مشروع جديد
                    </button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {data.projects.map(p => (
                      <div key={p.id} className="p-5 rounded-2xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800 space-y-2">
                        <span className="text-xs font-bold font-mono text-amber-500">{p.code}</span>
                        <h3 className="font-bold text-base">{p.name}</h3>
                        <p className="text-xs text-slate-400">{p.clientName}</p>
                        <div className="pt-2 border-t border-slate-800 flex justify-between text-xs font-mono">
                          <span>العقد: {formatCurrency(p.contractValue)}</span>
                          <span className="text-amber-500">التكلفة: {formatCurrency(p.actualCost)}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* PARTNERS */}
              {module === 'partners' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-bold">الشركاء وحسابات جاري الشريك</h2>
                      <p className="text-xs text-slate-400">توزيع الأرباح والمسحوبات ورأس المال</p>
                    </div>
                    <button onClick={handleDistributeProfits} className="px-4 py-2 rounded-xl bg-amber-500 text-black font-bold text-xs">
                      توزيع أرباح على الشركاء
                    </button>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {data.partners.map(pt => (
                      <div key={pt.id} className="p-5 rounded-2xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800 space-y-2">
                        <div className="flex justify-between">
                          <h3 className="font-bold text-base">{pt.name}</h3>
                          <span className="px-2 py-0.5 rounded bg-amber-500 text-black font-bold text-xs">{pt.ownershipPercentage}%</span>
                        </div>
                        <div className="text-xs space-y-1 text-slate-400 pt-2 border-t border-slate-800">
                          <p>رأس المال: {formatCurrency(pt.capitalContribution)}</p>
                          <p className="text-emerald-400">الأرباح المستلمة: {formatCurrency(pt.totalProfitReceived)}</p>
                          <p className="text-amber-500 font-bold">الرصيد الجاري الحالي: {formatCurrency(pt.currentAccountBalance)}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* INVOICES */}
              {module === 'invoices' && (
                <div className="space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="text-xl font-bold">الفواتير والمستخلصات</h2>
                  </div>
                  <div className="overflow-x-auto rounded-2xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800">
                    <table className="w-full text-start text-xs">
                      <thead className="bg-slate-50 dark:bg-[#161C2A] text-slate-400 border-b border-slate-800">
                        <tr>
                          <th className="p-3 text-start">رقم المستخلص</th>
                          <th className="p-3 text-start">العميل</th>
                          <th className="p-3 text-start">المشروع</th>
                          <th className="p-3 text-end">القيمة</th>
                          <th className="p-3 text-center">طباعة A4</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {data.invoices.map(inv => (
                          <tr key={inv.id}>
                            <td className="p-3 font-mono font-bold text-amber-500">{inv.invoiceNumber}</td>
                            <td className="p-3">{inv.clientName}</td>
                            <td className="p-3 text-slate-400">{inv.projectName}</td>
                            <td className="p-3 text-end font-mono font-bold">{formatCurrency(inv.total)}</td>
                            <td className="p-3 text-center">
                              <button onClick={() => setPrintInvoiceData(inv)} className="px-2 py-1 bg-amber-500/10 text-amber-500 font-bold rounded">
                                طباعة
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* REPORTS */}
              {module === 'reports' && (
                <div className="p-6 rounded-2xl bg-white dark:bg-[#111622] border border-slate-200 dark:border-slate-800 space-y-4 printable-area">
                  <div className="flex justify-between items-center border-b pb-3 border-slate-800">
                    <h3 className="font-bold text-base">قائمة الأرباح والخسائر الختامية (P&L)</h3>
                    <button onClick={() => window.print()} className="px-3 py-1 bg-amber-500 text-black font-bold text-xs rounded no-print">طباعة</button>
                  </div>
                  <div className="max-w-xl text-xs space-y-2">
                    <div className="flex justify-between font-bold py-1 border-b border-slate-800">
                      <span>إجمالي الإيرادات والمستخلصات:</span>
                      <span className="font-mono text-emerald-500">{formatCurrency(totalSalesVal)}</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-slate-800">
                      <span>تكاليف المشاريع المنفذة:</span>
                      <span className="font-mono text-rose-500">-{formatCurrency(totalProjectCosts)}</span>
                    </div>
                    <div className="flex justify-between py-2 rounded bg-amber-500 text-black font-black px-2">
                      <span>صافي ربح الشركة النهائي:</span>
                      <span className="font-mono">{formatCurrency(netProfitVal)}</span>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* PRINTABLE INVOICE MODAL */}
          {printInvoiceData && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75">
              <div className="w-full max-w-2xl bg-white text-slate-900 rounded-2xl p-8 printable-area space-y-4">
                <div className="no-print flex justify-between">
                  <span className="font-bold">معاينة المستخلص للطباعة</span>
                  <div className="flex gap-2">
                    <button onClick={() => window.print()} className="px-3 py-1 bg-amber-500 text-black font-bold text-xs rounded">طباعة</button>
                    <button onClick={() => setPrintInvoiceData(null)} className="px-3 py-1 bg-slate-200 text-black text-xs rounded">إغلاق</button>
                  </div>
                </div>
                <div className="border-b-2 border-amber-500 pb-3">
                  <h1 className="text-xl font-bold">شركة كونستركتا للمقاولات والتطوير</h1>
                  <p className="text-xs text-slate-500 font-mono">س.ت: 1092834 | ب.ض: 948-291-344</p>
                </div>
                <div className="text-xs space-y-1">
                  <p>رقم المستخلص: <span className="font-mono font-bold">{printInvoiceData.invoiceNumber}</span></p>
                  <p>العميل: <span className="font-bold">{printInvoiceData.clientName}</span></p>
                  <p>المشروع: <span>{printInvoiceData.projectName}</span></p>
                  <p className="text-base font-black pt-2">صافي القيمة المستحقة: {formatCurrency(printInvoiceData.total)}</p>
                </div>
                <div className="grid grid-cols-2 pt-8 text-center text-xs text-slate-400">
                  <div>مهندس الاستشاري</div>
                  <div>اعتماد الإدارة المالية</div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StandaloneConstructaApp />);
  </script>
</body>
</html>
